spring.application.name=WheatMafia

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/WheatMafia}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:2898}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

logging.level.com.example.example.security=DEBUG
logging.level.org.springframework.security=DEBUG

jwt.secret=${JWT_SECRET:change-me-in-production}
jwt.expiration-ms=36000000

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_AMQP_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}
spring.rabbitmq.ssl.enabled=${RABBITMQ_SSL_ENABLED:false}

spring.messaging.stomp.broker.relay.host=${RABBITMQ_HOST:localhost}
spring.messaging.stomp.broker.relay.port=${RABBITMQ_STOMP_PORT:61613}
spring.messaging.stomp.broker.relay.login=${RABBITMQ_USER:guest}
spring.messaging.stomp.broker.relay.password=${RABBITMQ_PASSWORD:guest}
spring.messaging.stomp.broker.relay.virtual-host=${RABBITMQ_VHOST:/}